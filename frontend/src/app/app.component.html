<header class="pictet-header" role="banner" aria-label="Pictet Application Header">
  <div class="pictet-header-container">
    <div class="brand-badge">
      <div class="brand-logo">
        <img class="logo1" src="logo_1.svg" alt="Pictet">
      </div>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-subtitle">Interactive Adventure Engine</span>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <app-book-catalog
      [books]="books"
      [selectedBookId]="selectedBook?.id ?? null"
      (bookSelected)="selectBook($event)"
    ></app-book-catalog>

    <app-book-upload
      [isUploading]="isUploading"
      (upload)="onBookUploaded($event)"
    ></app-book-upload>
  </aside>

  <main class="game-panel">
    <mat-card *ngIf="!selectedBook && !loading" class="empty-card">
      <mat-card-content class="empty-state-content">
        <h3 class="empty-title">Select an Adventure Book</h3>
        <p class="empty-text">
          Choose an interactive story from the catalog on the left, or upload a custom JSON book to begin your experience.
        </p>
      </mat-card-content>
    </mat-card>

    <app-game-play
      [book]="selectedBook"
      [session]="session"
      [healthPercent]="healthPercent()"
      [resumeSessionId]="resumeSessionId"
      [isSaving]="isSaving"
      (startAdventure)="startGame()"
      (chooseOption)="chooseOption($event)"
      (saveGame)="saveGame()"
      (resumeSession)="resumeGame($event)"
    ></app-game-play>
  </main>
</div>
