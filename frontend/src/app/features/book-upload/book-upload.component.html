<mat-card class="upload-card">
  <mat-card-header>
    <mat-card-title>Publish New Adventure</mat-card-title>
    <mat-card-subtitle>JSON Graph Import & BFS Audit</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p class="upload-hint">
      Import custom interactive book JSON files. Structural validity and reachable graph integrity will be audited automatically.
    </p>

    <div class="drop-zone" (click)="fileInput.click()">
      <svg class="upload-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M7 18.5h10a3.5 3.5 0 0 0 .6-6.95A5.6 5.6 0 0 0 7 9.7a4.4 4.4 0 0 0 0 8.8Z"></path>
        <path d="M12 10v8m-3-3 3-3 3 3"></path>
      </svg>
      <span class="drop-text">{{ isUploading ? "Auditing & Uploading..." : "Click to select JSON file" }}</span>
    </div>

    <button
      mat-flat-button
      color="accent"
      (click)="fileInput.click()"
      [disabled]="isUploading"
      class="upload-button"
    >
      <span>{{ isUploading ? "Processing..." : "Select Adventure File" }}</span>
    </button>

    <input
      #fileInput
      type="file"
      accept="application/json"
      hidden
      (change)="onFileSelected($event)"
    />
  </mat-card-content>
</mat-card>
