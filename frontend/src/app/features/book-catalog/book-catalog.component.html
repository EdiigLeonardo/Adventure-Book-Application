<mat-card class="catalog-card">
  <mat-card-header>
    <mat-card-title>Catalog of Adventures</mat-card-title>
    <mat-card-subtitle>Available Interactive Books</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="search-box" aria-label="Search library">
      <label for="book-search">Filter Library</label>
      <input id="book-search" type="text" placeholder="Search by title or topic..." />
      <button mat-icon-button>
        <mat-icon>search</mat-icon>
      </button>
    </div>

    <mat-list class="book-list">
      <mat-list-item
        *ngFor="let book of books"
        (click)="selectBook(book)"
        [class.active]="selectedBookId === book.id"
      >
        <div class="book-item">
          <span class="book-title">{{ book.title }}</span>
          <div class="book-badges">
            <span class="badge difficulty">{{ book.difficulty ?? "Standard" }}</span>
            <span class="badge sections">{{ book.sections.length }} scenes</span>
          </div>
        </div>
      </mat-list-item>
    </mat-list>
  </mat-card-content>
</mat-card>
