services:
  backend:
    build:
      context: ./AdventureBookApplication
    environment:
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-create-drop}
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED:-false}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-1MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-1MB}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
